<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" role="img" aria-labelledby="title desc">
  <title id="title">Same failure, fewer files</title>
  <desc id="desc">ReproMin's synthetic macOS and Linux demo reduces three files and 855 bytes to two files and 276 bytes. The reduced input keeps only NEEDLE, while reproduce.py still emits REPOMIN_DEMO_FAILURE and exits 1. The exact payload fingerprint is validated.</desc>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .title { font-family: system-ui, sans-serif; font-weight: 700; font-size: 27px; fill: #f1f5f9; }
    .small { font-size: 14px; fill: #b6c2d2; }
    .label { font-size: 14px; font-weight: 700; fill: #b6c2d2; letter-spacing: 1px; }
    .file { font-size: 18px; fill: #e2e8f0; }
    .muted { font-size: 17px; fill: #94a3b8; }
    .kept { font-size: 18px; font-weight: 700; fill: #fcd34d; }
  </style>
  <rect width="1000" height="400" rx="16" fill="#0f172a"/>
  <text x="28" y="42" class="title">Same failure. Fewer files.</text>
  <text x="28" y="69" class="small">Trusted synthetic demo · ReproMin v0.1.0.dev14 · macOS / Linux</text>
  <rect x="24" y="92" width="448" height="224" rx="10" fill="#182338" stroke="#334155"/>
  <rect x="528" y="92" width="448" height="224" rx="10" fill="#182338" stroke="#334155"/>
  <text x="46" y="122" class="label">BEFORE</text>
  <text x="240" y="122" class="small">3 files / 855 bytes</text>
  <text x="550" y="122" class="label">AFTER</text>
  <text x="744" y="122" class="small">2 files / 276 bytes</text>
  <line x1="46" y1="136" x2="450" y2="136" stroke="#334155"/>
  <line x1="550" y1="136" x2="954" y2="136" stroke="#334155"/>
  <text x="48" y="166" class="file">reproduce.py</text>
  <text x="48" y="192" class="file">input.txt</text>
  <text x="74" y="218" class="muted">remove-before</text>
  <text x="74" y="244" class="kept">NEEDLE</text>
  <text x="74" y="270" class="muted">remove-after</text>
  <text x="48" y="299" class="muted">unused.txt</text>
  <path d="M485 202h28m-8-8 8 8-8 8" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="552" y="166" class="file">reproduce.py</text>
  <text x="552" y="192" class="file">input.txt</text>
  <text x="578" y="218" class="kept">NEEDLE</text>
  <text x="552" y="270" class="small">Unrelated lines and file removed.</text>
  <rect x="24" y="332" width="952" height="50" rx="8" fill="#1e293b"/>
  <text x="42" y="353" font-size="16" fill="#fda4af">Preserved: REPOMIN_DEMO_FAILURE + exit 1</text>
  <text x="42" y="373" class="small">Exact payload fingerprint validated · Maintainer-created fixture</text>
</svg>
