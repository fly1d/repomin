    url: https://github.com/fly1d/repomin/blob/main/SECURITY.md
    about: Please follow the private reporting process in SECURITY.md. Do not disclose vulnerabilities in a public issue.
  - name: Usage questions
    url: https://github.com/fly1d/repomin/discussions
    about: Ask general questions about commands, backends, adapters, or reports in a searchable discussion.
  - name: Share a real CI or dependency failure
    url: https://github.com/fly1d/repomin/issues/new?template=real_failure.md
    about: Use the pilot template for a sanitized workflow, failure contract, and report evidence.
  - name: Share user workflow feedback
    url: https://github.com/fly1d/repomin/issues/new?template=adoption_feedback.md
    about: Tell us what was useful, confusing, or incompatible when you tried ReproMin.
