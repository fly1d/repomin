blank_issues_enabled: false
contact_links:
  - name: Help reduce a public failure
    url: https://github.com/fly1d/repomin/issues/11
    about: Share the repository and revision, failing command, and a short failure message. No ReproMin installation or run report required.
  - name: Security vulnerability
    url: https://github.com/fly1d/repomin/blob/main/SECURITY.md
    about: Please follow the private reporting process in SECURITY.md. Do not disclose vulnerabilities in a public issue.
  - name: Usage questions
    url: https://github.com/fly1d/repomin/discussions/new?category=q-a
    about: Ask for help with commands, backends, adapters, or reports using the structured Q&A form.
  - name: Share a result
    url: https://github.com/fly1d/repomin/discussions/new?category=show-and-tell
    about: Show a useful, blocked, or inconclusive reduction with enough context for another user to learn from it.
