title: "[Result] "
body:
  - type: markdown
    attributes:
      value: |
        Share the result first, then enough context for another user to judge
        whether the workflow fits them. Short answers are welcome. Report
        security vulnerabilities through SECURITY.md instead.
  - type: textarea
    id: result-value
    attributes:
      label: Result and value
      description: What changed, what did you learn, or what became easier?
      placeholder: >-
        The reduced reproduction was used in... / The run was blocked by...
    validations:
      required: true
  - type: textarea
    id: workflow-evidence
    attributes:
      label: Workflow and evidence
      description: >-
        Include the ecosystem, failure shape, ReproMin version/backend,
        sanitized before/after size, and validation or replay evidence.
      placeholder: >-
        Gradle test failure; v0.1.0.dev11; 854 -> 11 files; exact fingerprint;
        5/5 fresh-copy replays.
    validations:
      required: true
  - type: textarea
    id: limits-or-next-step
    attributes:
      label: Limits or requested next step
      description: Optional. What remains uncertain, or what response would help?
      placeholder: This still depends on... / I would like help with...
  - type: checkboxes
    id: safety
    attributes:
      label: Safety
      options:
        - label: >-
            I removed secrets, credentials, private URLs, proprietary source,
            customer data, and confidential logs.
          required: true
