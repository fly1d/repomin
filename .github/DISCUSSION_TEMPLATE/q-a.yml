title: "[Question] "
body:
  - type: markdown
    attributes:
      value: |
        Ask one clear question, then add only the context needed to answer it.
        Conceptual questions do not need commands or logs. Report security
        vulnerabilities through SECURITY.md instead.
  - type: textarea
    id: question
    attributes:
      label: Question
      description: >-
        What answer or decision do you need? Put it in the first sentence.
      placeholder: How can I preserve this failure without also accepting...?
    validations:
      required: true
  - type: textarea
    id: relevant-context
    attributes:
      label: Relevant context
      description: >-
        Explain the goal, current result, and impact. For a run, include
        versions, OS/backend, working directory, sanitized command or output,
        and what you tried.
      placeholder: >-
        Goal and current result first; add runtime details only when they
        affect the answer.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety
      options:
        - label: >-
            I removed secrets, credentials, private URLs, proprietary source,
            customer data, and confidential logs.
          required: true
