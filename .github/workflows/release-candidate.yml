name: Release candidate

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and validate ${{ github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Verify tag matches source version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
            printf 'release candidate requires a tag ref (found %s)\n' \
              "$GITHUB_REF_TYPE" >&2
            exit 1
          fi
          source_version="$(PYTHONPATH=src python -c 'import repomin; print(repomin.__version__)')"
          if [[ "$RELEASE_TAG" != "v$source_version" ]]; then
            printf 'release tag %s does not match source version %s\n' \
              "$RELEASE_TAG" "$source_version" >&2
            exit 1
          fi
      - name: Install build tools
        run: python -m pip install build twine
      - name: Build wheel and source distribution
        run: python -m build --outdir release-dist
      - name: Check distribution metadata
        run: python -m twine check release-dist/*
      - name: Validate release candidate
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          wheels=(release-dist/*.whl)
          sdists=(release-dist/*.tar.gz)
          if (( ${#wheels[@]} != 1 || ${#sdists[@]} != 1 )); then
            printf 'expected one wheel and one source distribution; found %d and %d\n' \
              "${#wheels[@]}" "${#sdists[@]}" >&2
            exit 1
          fi
          python scripts/check_release_artifacts.py \
            --tag "$RELEASE_TAG" \
            "${wheels[0]}" \
            "${sdists[0]}" \
            | tee release-record.json
      - name: Store validated release candidate
        uses: actions/upload-artifact@v6
        with:
          name: release-candidate-${{ github.ref_name }}
          path: |
            release-dist/*.whl
            release-dist/*.tar.gz
            release-record.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
